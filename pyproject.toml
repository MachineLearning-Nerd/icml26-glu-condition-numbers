[project]
name = "glu-condition-reproduction"
version = "0.1.0"
description = "Claim-by-claim CPU reproduction of arXiv:2605.20749"
requires-python = ">=3.12,<3.13"
dependencies = [
  "einops==0.8.1",
  "matplotlib==3.10.3",
  "numpy==2.2.6",
  "pandas==2.3.0",
  "scipy==1.15.3",
  "threadpoolctl==3.6.0",
  "torch==2.7.1",
  "torchvision==0.22.1",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

